name: Atualizar dashboard

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy scipy
      - run: python scripts/update_dashboard.py
      - name: Commit
        run: |
          git config user.name "thermoLEO bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html history.json
          git diff --cached --quiet && echo "sem mudancas" || (git commit -m "Atualizacao automatica" && git push)
